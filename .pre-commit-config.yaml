# Pre-commit hooks for gpu-perf-tune contributors.
#
# Local setup:
#   cd plugins/profile-and-optimize/server && pip install -e ".[dev]"
#   pre-commit install
#
# Then `git commit` runs the hooks below on staged files; `pre-commit run
# --all-files` runs them on the whole tree.
#
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.3
    hooks:
      - id: ruff
        args: [--fix, --select, E4,E7,E9,F, --config, plugins/profile-and-optimize/server/pyproject.toml]
        files: '^plugins/profile-and-optimize/server/(perf_baseline|evidence|slurm|tools/(perf_baseline|evidence|slurm))/'
      - id: ruff-format
        args: [--config, plugins/profile-and-optimize/server/pyproject.toml]
        files: '^plugins/profile-and-optimize/server/(perf_baseline|evidence|slurm|tools/(perf_baseline|evidence|slurm))/'

  - repo: local
    hooks:
      - id: check-doc-links-no-network
        name: check-doc-links (no-network)
        entry: bash scripts/check-doc-links.sh --no-network --quiet
        language: system
        pass_filenames: false
        files: '\.md$'
      - id: lint-skill-mcp-args
        name: lint-skill-mcp-args (descriptor cross-check)
        entry: python3 scripts/lint-skill-mcp-args.py
        language: system
        pass_filenames: false
        files: '^plugins/profile-and-optimize/skills/.*/SKILL\.md$'
      - id: lint-skill-counts
        name: lint-skill-counts (single source of truth for skill totals)
        entry: python3 scripts/lint-skill-counts.py
        language: system
        pass_filenames: false
        files: '(^plugins/profile-and-optimize/skills/|^README\.md$|^CONTRIBUTING\.md$|^REVIEWERS\.md$|^SECURITY\.md$|^Makefile$|^plugins/profile-and-optimize/README\.md$|^plugins/profile-and-optimize/\.claude-plugin/plugin\.json$|^\.claude-plugin/marketplace\.json$)'
      - id: lint-tool-counts
        name: lint-tool-counts (single source of truth for MCP tool / library totals)
        entry: python3 scripts/lint-tool-counts.py
        language: system
        pass_filenames: false
        files: '(^plugins/profile-and-optimize/server/(mcp_surface\.py|README\.md|AGENTS\.md|docs/|tools/profile_and_optimize_mcp/README\.md)|^README\.md$|^CONTRIBUTING\.md$|^REVIEWERS\.md$|^SECURITY\.md$|^Makefile$|^plugins/profile-and-optimize/README\.md$|^plugins/profile-and-optimize/\.claude-plugin/plugin\.json$)'
      - id: lint-versions
        name: lint-versions (VERSION source of truth)
        entry: python3 scripts/lint-versions.py
        language: system
        pass_filenames: false
        files: '(^VERSION$|^CHANGELOG\.md$|^scripts/lint-versions\.py$|^plugins/profile-and-optimize/README\.md$|^plugins/profile-and-optimize/\.claude-plugin/plugin\.json$|^plugins/profile-and-optimize/server/pyproject\.toml$|^plugins/profile-and-optimize/server/tools/profile_and_optimize_mcp/pyproject\.toml$|^plugins/profile-and-optimize/server/tools/profile_and_optimize_mcp/src/profile_and_optimize_mcp/__init__\.py$)'
