[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profile-and-optimize-server"
version = "0.4.0"
description = "GPU inference profiling and optimization server. Ships 8 CLI libraries and 53 MCP tools total, including 51 contract-driven tools and 2 auxiliary tools."
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Project contributors"}]
license = "MIT"
dependencies = [
  "jsonschema>=4.23",
  "mcp[cli]>=1.2.0,<2",
  "PyYAML>=6.0.2",
  "starlette>=1.3.1",
]

[project.optional-dependencies]
leaderboard = [
  "matplotlib>=3.8",
  "openpyxl>=3.1",
]
# matplotlib supports PDF rendering. pandas supports aggregation and log parsing.
# pyarrow and boto3 support optional Parquet publishing to an operator-owned S3 bucket.
perf_tune_report = [
  "matplotlib>=3.8",
  "pandas>=2.0",
  "pyarrow>=15.0",
  "boto3>=1.34",
  # Exact o200k_base token sizing for the AA workload generator.
  "tiktoken>=0.7",
]
# `dev` is the complete contributor and CI environment. Feature dependencies
# are repeated here because PEP 621 extras cannot include sibling extras. This
# keeps the default pytest target from skipping renderer and lake tests.
# The Agent Skills validator uses a commit pin because it is installed directly
# from a Git repository.
dev = [
  "matplotlib>=3.8",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pyarrow>=15.0",
  "boto3>=1.34",
  "tiktoken>=0.7",
  "pre-commit>=4.0",
  "pyright>=1.1.411,<1.2",
  "pytest>=8.0,<10",
  "pytest-xdist>=3.6",
  "ruff>=0.16.3,<0.17",
  "shellcheck-py==0.11.0.1",
  "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref",
]

[project.urls]
Homepage = "https://github.com/cfregly/gpu-perf-tune"
Issues = "https://github.com/cfregly/gpu-perf-tune/issues"
Security = "https://github.com/cfregly/gpu-perf-tune/security/policy"

[project.scripts]
perftunereport = "perf_tune_report.cli:main"

[tool.setuptools.packages.find]
include = [
  "ai_tuning*",
  "profile*",
  "perf_baseline*",
  "evidence*",
  "slurm*",
  "findings*",
  "perf_tune_report*",
  "known_good_config*",
  "tools*",
]
exclude = [
  "tools.profile_and_optimize_mcp*",
  "**.tests*",
  "experiments*",
]
namespaces = true

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  "experiments",
  "__pycache__",
  ".pytest_cache",
]

[tool.ruff.lint]
# Keep the enforced set explicit so a Ruff upgrade cannot silently change the
# repository gate. These rules cover syntax, imports, common correctness bugs,
# modern Python, exception handling, and Ruff-specific correctness checks.
select = [
  "E4",
  "E7",
  "E9",
  "F",
  "I",
  "B",
  "BLE",
  "UP",
  "RUF",
  "S110",
  "S112",
]

[tool.ruff.lint.per-file-ignores]
# These entry points adjust sys.path before importing sibling command modules.
"**/tools/ai_tuning/*.py" = ["E402"]
"**/tools/perf_tune_report/importers/inference_drive_load.py" = ["E402"]
"**/tools/perf_tune_report/importers/zymtrace_kernels.py" = ["E402"]
# Several direct tests do the same to exercise the installed and source-tree
# entry points. Runtime behavior remains covered by pytest.
"**/test_*.py" = ["E402"]
"**/tests/*.py" = ["E402"]

[tool.pytest.ini_options]
# The canonical `make pytest` target covers every checked-in offline Python
# test under tools. Hardware checks must use a separate, explicitly named
# target instead of being hidden from this discovery root.
testpaths = ["tools"]
